services:
  db:
    image: postgres:15
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_EXTERNAL_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: always
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --address ":${MINIO_INTERNAL_API_PORT}" --console-address ":${MINIO_INTERNAL_CONSOLE_PORT}"
    ports:
      - "${MINIO_PORT_API}:${MINIO_INTERNAL_API_PORT}"
      - "${MINIO_PORT_CONSOLE}:${MINIO_INTERNAL_CONSOLE_PORT}"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_PORT: ${BACKEND_INTERNAL_PORT}
        GRPC_PORT: ${GRPC_PORT}
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      MINIO_ENDPOINT: minio:${MINIO_INTERNAL_API_PORT}
      MINIO_PUBLIC_ENDPOINT: localhost:${MINIO_PORT_API}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      GRPC_PORT: ${GRPC_PORT}
      HTTP_PORT: ${BACKEND_INTERNAL_PORT}
      AGGREGATOR_BASE_URL: ${AGGREGATOR_BASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT}:${BACKEND_INTERNAL_PORT}"
      - "${GRPC_PORT}:${GRPC_PORT}"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        FRONTEND_INTERNAL_PORT: ${FRONTEND_INTERNAL_PORT}
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_INTERNAL_PORT}"

volumes:
  postgres_data:
  minio_data:

# Elasticsearch + Kibana + Filebeat + Heartbeat + Prometheus + Grafana
# Запуск из корня: make obs-up
# Kibana: http://localhost:5601
# Elasticsearch: http://localhost:9200
# Prometheus: http://localhost:9090
# Grafana: http://localhost:3001 (admin/admin)

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: morent-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ELASTIC_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - morent-obs

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: morent-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - morent-obs

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: morent-filebeat
    user: root
    command: filebeat -e -strict.perms=false
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - morent-obs
      - kafka_morent-kafka
      - default

  heartbeat:
    image: docker.elastic.co/beats/heartbeat:8.15.0
    container_name: morent-heartbeat
    user: root
    command: heartbeat -e -strict.perms=false
    volumes:
      - ./heartbeat.yml:/usr/share/heartbeat/heartbeat.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - morent-obs
      - kafka_morent-kafka
      - default

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: morent-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - blackbox-exporter
      - cadvisor
    networks:
      - morent-obs
      - kafka_morent-kafka
      - default

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: morent-blackbox-exporter
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "${BLACKBOX_PORT:-9115}:9115"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - morent-obs
      - default

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: morent-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "${CADVISOR_PORT:-8089}:8080"
    restart: unless-stopped
    networks:
      - morent-obs

  grafana:
    image: grafana/grafana:11.3.1
    container_name: morent-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - morent-obs

volumes:
  es_data:
  prometheus_data:
  grafana_data:

networks:
  morent-obs:
    name: morent-obs
  kafka_morent-kafka:
    external: true
    name: kafka_morent-kafka

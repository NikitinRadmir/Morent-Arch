global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: blackbox-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:1488/health
        labels:
          probe_group: health
          service: morent-backend
      - targets:
          - http://host.docker.internal:8081/health
        labels:
          probe_group: health
          service: payment-service
      - targets:
          - http://host.docker.internal:8080/health
        labels:
          probe_group: health
          service: car-aggregator
      - targets:
          - http://host.docker.internal:8082/health
        labels:
          probe_group: health
          service: user-system
      - targets:
          - http://host.docker.internal:8083/health
        labels:
          probe_group: health
          service: generator-service
      - targets:
          - http://host.docker.internal:5112/health
        labels:
          probe_group: health
          service: emailservice-api
      - targets:
          - http://elasticsearch:9200
        labels:
          probe_group: health
          service: elasticsearch
      - targets:
          - http://kibana:5601/api/status
        labels:
          probe_group: health
          service: kibana
      - targets:
          - http://host.docker.internal:8090
        labels:
          probe_group: health
          service: kafka-ui
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-ready
    metrics_path: /probe
    params:
      module: [http_2xx_or_503]
    static_configs:
      - targets:
          - http://host.docker.internal:1488/ready
        labels:
          probe_group: ready
          service: morent-backend
      - targets:
          - http://host.docker.internal:8081/ready
        labels:
          probe_group: ready
          service: payment-service
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

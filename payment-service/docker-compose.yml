services:
  payment-service:
    build:
      context: ..
      dockerfile: payment-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      HTTP_ADDR: ${HTTP_ADDR:-:8081}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-host.docker.internal:9092}
      KAFKA_TOPIC_BANK_COMMANDS: ${KAFKA_TOPIC_BANK_COMMANDS:-morent.bank.commands}
      KAFKA_TOPIC_BANK_RESPONSES: ${KAFKA_TOPIC_BANK_RESPONSES:-morent.bank.responses}
      KAFKA_GROUP_PAYMENT_BANK: ${KAFKA_GROUP_PAYMENT_BANK:-payment-service-bank}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3

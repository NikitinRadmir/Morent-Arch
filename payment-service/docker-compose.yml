services:
  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payment}
      POSTGRES_DB: ${POSTGRES_DB:-payment}
    ports:
      - "${PAYMENT_DB_PORT:-5438}:5432"
    volumes:
      - payment_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default

    restart: unless-stopped

  payment-service:
    build:
      context: ..
      dockerfile: payment-service/Dockerfile
    depends_on:
      payment-db:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      HTTP_ADDR: ${HTTP_ADDR:-:8081}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-payment}:${POSTGRES_PASSWORD:-payment}@payment-db:5432/${POSTGRES_DB:-payment}?sslmode=disable
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC_BANK_COMMANDS: ${KAFKA_TOPIC_BANK_COMMANDS:-morent.bank.commands}
      KAFKA_TOPIC_BANK_RESPONSES: ${KAFKA_TOPIC_BANK_RESPONSES:-morent.bank.responses}
      KAFKA_GROUP_PAYMENT_BANK: ${KAFKA_GROUP_PAYMENT_BANK:-payment-service-bank}
    networks:
      - default
      - morent-kafka
    labels:
      co.elastic.logs/enabled: "true"
      co.elastic.logs/service: "payment-service"
      co.elastic.logs/log_type: "app"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  payment_pg_data:

networks:
  default:
    name: payment-service_default
  morent-kafka:
    external: true
    name: kafka_morent-kafka

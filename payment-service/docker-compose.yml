services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

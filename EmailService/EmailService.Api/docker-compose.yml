services:
  emailservice.api:
    image: ${DOCKER_REGISTRY-}emailserviceapi
    container_name: emailservice-api

    build:
      context: ..
      dockerfile: EmailService.Api/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080

      # PostgreSQL
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=email_service;Username=postgres;Password=password123

      # RabbitMQ
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest

    ports:
      - "5112:8080"

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    volumes:
      - ./logs/api:/app/logs

    restart: unless-stopped

    networks:
      - emailservice-net

  emailservice.worker:
    image: ${DOCKER_REGISTRY-}emailserviceworker
    container_name: emailservice-worker

    build:
      context: ..
      dockerfile: EmailService.Worker/Dockerfile

    environment:
      DOTNET_ENVIRONMENT: Docker

      ConnectionStrings__EmailDb: Host=postgres;Port=5432;Database=email_service;Username=postgres;Password=password123

      Kafka__Enabled: ${KAFKA_ENABLED:-true}
      Kafka__Brokers: ${KAFKA_BROKERS:-host.docker.internal:9092}
      Kafka__Topic: ${KAFKA_TOPIC_EMAILS:-morent.emails}
      Kafka__GroupId: email-service

  # RabbitMQ
      RabbitMq__Host: rabbitmq://rabbitmq
      RabbitMq__User: guest
      RabbitMq__Pass: guest

      Templates__BasePath: /app/Templates

  # Resend
      Resend__ApiKey: re_isY4dWzL_NxA825SJT2ckFsag7UpZ9aek
      Resend__FromEmail: onboarding@resend.dev
      Resend__FromName: AutoRental Test

  # SMTP
      Smtp__Host: smtp.yandex.ru
      Smtp__Port: 587
      Smtp__Username: ayagarifullin@kpfu.ru
      Smtp__Password: mecvcslcmwyczhxz
      Smtp__UseSsl: true
      Smtp__FromEmail: ayagarifullin@kpfu.ru
      Smtp__FromName: Morent

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    volumes:
      - ../EmailService.Worker/Templates:/app/Templates:ro
      - ./logs/worker:/app/logs

    restart: unless-stopped

    networks:
      - emailservice-net

  postgres:
    image: postgres:16-alpine
    container_name: emailservice-postgres

    environment:
      POSTGRES_DB: email_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123

    ports:
      - "5435:5432"

    volumes:
      - pg-data:/var/lib/postgresql/data

    restart: unless-stopped

    networks:
      - emailservice-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d email_service"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: emailservice-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    restart: unless-stopped

    networks:
      - emailservice-net

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  emailservice-net:
    driver: bridge

volumes:
  pg-data:
  rabbitmq-data:
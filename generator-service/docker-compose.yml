version: '3.8'

services:
  generator-service:
    build: .
    ports:
      - "${GENERATOR_PORT:-8083}:8080"
    environment:
      - PORT=8080
      - CORS_ALLOWED_ORIGINS=*
    restart: unless-stopped
    labels:
      co.elastic.logs/enabled: "true"
      co.elastic.logs/service: "generator-service"
      co.elastic.logs/log_type: "app"

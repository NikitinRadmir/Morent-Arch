openapi: 3.0.3
info:
  title: User System API
  description: |
    Интерактивная документация для проверки HTTP API (пути совпадают с сервером Gin).
    Для защищённых методов нажмите **Authorize** и введите `Bearer <access_token>`.
  version: 1.0.0

servers:
  - url: /
    description: Текущий хост (Try it out)

tags:
  - name: Health
  - name: Auth
  - name: Companies
  - name: Users
  - name: Roles
  - name: RolePermissions
  - name: RPC

paths:
  /health:
    get:
      tags: [Health]
      summary: Проверка живости сервиса
      operationId: healthCheck
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Регистрация
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Создано
        "400":
          description: Ошибка валидации

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Вход
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Токены и пользователь
        "401":
          description: Неверные учётные данные

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Выход
      operationId: authLogout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Успешный выход
        "401":
          description: Не авторизован

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Обновление access-токена
      operationId: authRefresh
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Новые токены
        "400":
          description: Неверное тело запроса

  /api/auth/change-password:
    put:
      tags: [Auth]
      summary: Смена пароля
      operationId: authChangePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Успех
        "401":
          description: Не авторизован

  /api/companies:
    post:
      tags: [Companies]
      summary: Создать компанию (публично)
      operationId: companiesCreatePublic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyPublicRequest"
      responses:
        "201":
          description: Компания создана
    get:
      tags: [Companies]
      summary: Список компаний
      operationId: companiesList
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Список
        "401":
          description: Не авторизован

  /api/companies/{id}:
    get:
      tags: [Companies]
      summary: Компания по ID
      operationId: companiesGetById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      responses:
        "200":
          description: Найдено
        "404":
          description: Не найдено
    put:
      tags: [Companies]
      summary: Обновить компанию
      operationId: companiesUpdate
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanyRequest"
      responses:
        "200":
          description: Обновлено
    delete:
      tags: [Companies]
      summary: Удалить компанию
      operationId: companiesDelete
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      responses:
        "200":
          description: Удалено

  /api/users:
    get:
      tags: [Users]
      summary: Список пользователей
      operationId: usersList
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Список
    post:
      tags: [Users]
      summary: Создать пользователя
      operationId: usersCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Создан

  /api/users/profile:
    get:
      tags: [Users]
      summary: Профиль текущего пользователя
      operationId: usersProfileGet
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Профиль
    put:
      tags: [Users]
      summary: Обновить профиль
      operationId: usersProfileUpdate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Обновлено

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Пользователь по ID
      operationId: usersGetById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      responses:
        "200":
          description: Найден
    put:
      tags: [Users]
      summary: Обновить пользователя
      operationId: usersUpdate
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Обновлено
    delete:
      tags: [Users]
      summary: Удалить пользователя
      operationId: usersDelete
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      responses:
        "200":
          description: Удалено

  /api/users/{id}/change-password:
    put:
      tags: [Users]
      summary: Смена пароля пользователя (админ)
      operationId: usersChangePassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Успех

  /api/roles:
    post:
      tags: [Roles]
      summary: Создать роль
      operationId: rolesCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Создана

  /api/roles/{id}:
    get:
      tags: [Roles]
      summary: Роль по ID
      operationId: rolesGetById
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      responses:
        "200":
          description: Найдена
    put:
      tags: [Roles]
      summary: Обновить роль
      operationId: rolesUpdate
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Обновлена
    delete:
      tags: [Roles]
      summary: Удалить роль
      operationId: rolesDelete
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UUIDPathId"
      responses:
        "200":
          description: Удалена

  /api/roles/company/{companyId}:
    get:
      tags: [Roles]
      summary: Роли компании
      operationId: rolesByCompany
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Список ролей

  /api/role-permissions/assign:
    post:
      tags: [RolePermissions]
      summary: Назначить право роли
      operationId: rolePermAssign
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignPermissionRequest"
      responses:
        "200":
          description: Назначено

  /api/role-permissions/roles/{roleId}/permissions:
    get:
      tags: [RolePermissions]
      summary: Права роли
      operationId: rolePermListByRole
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Список

  /api/role-permissions/permissions/{permissionId}/roles:
    get:
      tags: [RolePermissions]
      summary: Роли с данным правом
      operationId: rolePermListRolesByPermission
      security:
        - bearerAuth: []
      parameters:
        - name: permissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Список

  /api/role-permissions/roles/{roleId}/permissions/{permissionId}/check:
    get:
      tags: [RolePermissions]
      summary: Проверить назначение права роли
      operationId: rolePermCheck
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: permissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Результат проверки

  /api/role-permissions/roles/{roleId}/permissions/bulk-assign:
    post:
      tags: [RolePermissions]
      summary: Массовое назначение прав
      operationId: rolePermBulkAssign
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkPermissionsRequest"
      responses:
        "200":
          description: Успех

  /api/role-permissions/roles/{roleId}/permissions/bulk-remove:
    post:
      tags: [RolePermissions]
      summary: Массовое снятие прав
      operationId: rolePermBulkRemove
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkPermissionsRequest"
      responses:
        "200":
          description: Успех

  /api/rpc:
    post:
      tags: [RPC]
      summary: JSON-RPC 2.0
      operationId: jsonRpc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcRequest"
            examples:
              companyHierarchy:
                summary: Иерархия компании
                value:
                  jsonrpc: "2.0"
                  method: company.getHierarchy
                  params:
                    company_id: "00000000-0000-0000-0000-000000000000"
                  id: 1
              userByRole:
                summary: Пользователи по роли
                value:
                  jsonrpc: "2.0"
                  method: user.getByRole
                  params:
                    role_id: "00000000-0000-0000-0000-000000000000"
                  id: 2
      responses:
        "200":
          description: Ответ JSON-RPC

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Вставьте только токен или строку вида `Bearer ...` — Swagger добавит префикс сам.

  parameters:
    UUIDPathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, first_name, last_name, company_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string
        company_name:
          type: string
        phone:
          type: string
        department:
          type: string
        position:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
        new_password:
          type: string
          minLength: 8

    CreateCompanyPublicRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        domain:
          type: string

    UpdateCompanyRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        domain:
          type: string
        is_active:
          type: boolean

    CreateUserRequest:
      type: object
      required: [company_id, email, password]
      properties:
        company_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        department:
          type: string
        position:
          type: string

    UpdateUserRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        department:
          type: string
        position:
          type: string
        is_active:
          type: boolean

    CreateRoleRequest:
      type: object
      required: [company_id, name]
      properties:
        company_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    AssignPermissionRequest:
      type: object
      required: [role_id, permission_id]
      properties:
        role_id:
          type: string
          format: uuid
        permission_id:
          type: string
          format: uuid

    BulkPermissionsRequest:
      type: object
      required: [permission_ids]
      properties:
        permission_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    JsonRpcRequest:
      type: object
      required: [jsonrpc, method, id]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        method:
          type: string
        params:
          type: object
          additionalProperties: true
        id:
          oneOf:
            - type: string
            - type: integer

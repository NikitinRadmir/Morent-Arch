services:
  db:
    image: postgres:16-alpine
    container_name: user-system-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-user_system}
    ports:
      - "${DB_EXTERNAL_PORT:-5437}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - user-system-network

  app:
    build:
      context: ..
      dockerfile: user-system-develop/docker/app/Dockerfile
    container_name: user-system-api
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_PORT=8080
      - DB_HOST=db
      - KAFKA_ENABLED=${KAFKA_ENABLED:-true}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - KAFKA_TOPIC_USERS=${KAFKA_TOPIC_USERS:-morent.users}
      - KAFKA_CONSUMER_GROUP=${KAFKA_CONSUMER_GROUP:-user-system-morent-sync}
      - MORENT_COMPANY_NAME=${MORENT_COMPANY_NAME:-Morent}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - user-system-network
      - morent-kafka
    ports:
      - "${APP_PORT:-8082}:8080"
    command: ["./main", "--clear-db=false"]

volumes:
  postgres_data:

networks:
  user-system-network:
    driver: bridge
  morent-kafka:
    external: true
    name: kafka_morent-kafka

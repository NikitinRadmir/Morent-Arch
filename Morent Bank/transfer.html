<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Morent Bank — Перевод</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="mb-bg-pattern">
    <nav class="mb-nav-simple">
      <div class="container d-flex justify-content-between align-items-center">
        <a class="mb-logo" href="index.html">
          <span class="mb-logo-mark">M</span>
          Morent Bank
        </a>
        <a href="index.html" class="mb-nav-muted-link">На главную</a>
      </div>
    </nav>

    <div class="mb-auth-wrapper">
      <div class="mb-auth-card">
        <h1 class="mb-auth-title">Перевод</h1>
        <form action="#" method="post">
          <div class="mb-3">
            <label class="form-label mb-form-label" for="transfer-phone">Телефон получателя</label>
            <input
              type="tel"
              class="form-control mb-form-control phone-input"
              id="transfer-phone"
              name="recipient_phone"
              placeholder="8 (___) ___-__-__"
              autocomplete="tel"
            />
          </div>
          <div class="mb-3">
            <label class="form-label mb-form-label" for="transfer-amount">Сумма к списанию, ₽</label>
            <input
              type="number"
              class="form-control mb-form-control"
              id="transfer-amount"
              name="amount"
              min="1"
              step="0.01"
              placeholder="0"
              inputmode="decimal"
            />
          </div>
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" value="1" id="transfer-confirm" required />
            <label class="form-check-label small text-secondary" for="transfer-confirm">
              Я уверен в своём решении перевести указанную сумму на указанный счёт
            </label>
          </div>
          <button type="submit" class="btn mb-btn-submit">Перевести</button>
        </form>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/phone-mask.js"></script>
  </body>
</html>

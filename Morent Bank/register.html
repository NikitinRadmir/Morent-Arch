<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Morent Bank — Регистрация</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="mb-bg-pattern">
    <nav class="mb-nav-simple">
      <div class="container d-flex justify-content-between align-items-center">
        <a class="mb-logo" href="index.html">
          <span class="mb-logo-mark">M</span>
          Morent Bank
        </a>
        <a href="login.html" class="mb-nav-extra-link">Вход</a>
      </div>
    </nav>

    <div class="mb-auth-wrapper">
      <div class="mb-auth-card">
        <h1 class="mb-auth-title">Регистрация</h1>
        <form action="#" method="post">
          <div class="mb-3">
            <label class="form-label mb-form-label" for="reg-phone">Телефон</label>
            <input
              type="tel"
              class="form-control mb-form-control phone-input"
              id="reg-phone"
              name="phone"
              placeholder="8 (___) ___-__-__"
              autocomplete="tel"
            />
          </div>
          <div class="mb-3">
            <label class="form-label mb-form-label" for="reg-password">Пароль</label>
            <input
              type="password"
              class="form-control mb-form-control"
              id="reg-password"
              name="password"
              autocomplete="new-password"
            />
          </div>
          <div class="mb-4">
            <label class="form-label mb-form-label" for="reg-password2">Подтверждение пароля</label>
            <input
              type="password"
              class="form-control mb-form-control"
              id="reg-password2"
              name="password_confirm"
              autocomplete="new-password"
            />
          </div>
          <button type="submit" class="btn mb-btn-submit">Зарегистрироваться</button>
        </form>
        <p class="text-center mt-3 mb-0 mb-link-muted">
          Уже есть аккаунт? <a href="login.html">Войти</a>
        </p>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/phone-mask.js"></script>
  </body>
</html>
